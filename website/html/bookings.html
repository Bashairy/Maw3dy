<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
    <meta charset="UTF-8">
    <title>الحجوزات</title>
</head>

<body>

    <h1>جميع الحجوزات 📋</h1>

    <table border="1">

        <tr>
            <th>ID</th>
            <th>الاسم</th>
            <th>الهاتف</th>
            <th>التاريخ</th>
            <th>الوقت</th>
            <th>الحالة</th>
        </tr>

        {% for booking in bookings %}

        <tr>
            <td>{{ booking[0] }}</td>
            <td>{{ booking[1] }}</td>
            <td>{{ booking[2] }}</td>
            <td>{{ booking[3] }}</td>
            <td>{{ booking[4] }}</td>
            <td>{{ booking[5] }}</td>
        </tr>

        {% endfor %}

    </table>

</body>

</html>
